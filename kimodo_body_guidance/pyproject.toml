[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo-body-pose-guidance"
version = "0.2.0"
description = "Host-agnostic Root, interaction and body-guidance primitives for Kimodo research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.23", "torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kimodo_sceneco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
